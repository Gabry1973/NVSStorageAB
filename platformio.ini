; PlatformIO / pioarduino project used to develop and compile the library
; examples inside VS Code.
;
; Pick the example from the environment selector in the PlatformIO status bar
; (or: pio run -e BasicSettings). "pio run" with no -e builds all of them.
;
; Host unit tests (no board needed, fake in-memory NVS):
;   pio test -e host
;
; To use the library in another project, add to that project's platformio.ini:
;   lib_deps = https://github.com/Gabry1973/NVSStorageAB.git
; or, for a local copy:
;   lib_deps = symlink://D:/path/to/NVSStorageAB

[platformio]
default_envs = BasicSettings, PowerFailData, VersionUpgrade

[env]
lib_deps = symlink://.

[esp32]
; pioarduino: Arduino-ESP32 core 3.x (ESP-IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_compat_mode = strict
build_flags = -Wall -Wextra
extra_scripts = pre:tools/select_example.py
; The tests in test/ run on the host only (env:host).
test_ignore = *

[env:BasicSettings]
extends = esp32
custom_example = BasicSettings

[env:PowerFailData]
extends = esp32
custom_example = PowerFailData

[env:VersionUpgrade]
extends = esp32
custom_example = VersionUpgrade

[env:host]
; Windows host build (MinGW toolchain is installed automatically).
platform = windows_x86
test_framework = unity
lib_deps =
    ${env.lib_deps}
    throwtheswitch/Unity@^2.6.1
; library.json declares espressif32/arduino only: compile it anyway.
lib_compat_mode = off
build_flags = -Wall -Wextra -I test/test_host/fake
extra_scripts = pre:tools/host_flags.py
